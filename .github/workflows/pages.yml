name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: kanban-react/package-lock.json
      - name: Build React app
        working-directory: kanban-react
        env:
          VITE_BASE: /${{ github.event.repository.name }}/kanban-react/
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r kanban-react/dist _site/kanban-react
          cp -r kanban-todo _site/kanban-todo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
